build-image:
  stage: package
  tags:
    - k8s
  needs:
    - compile
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script: []
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$HARBOR_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --destination "$HARBOR_IMAGE:latest" \
        $KANIKO_EXTRA_ARGS
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-app:
  stage: deploy
  tags:
    - k8s
  needs:
    - build-image
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [""]
  before_script: []
  environment:
    name: app-dev
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl version --client
    # 命名空间、数据库、Service 都在清单里
    - kubectl apply -f k8s/app-dev.yml
    # 换成本次构建的镜像
    - kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$HARBOR_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
