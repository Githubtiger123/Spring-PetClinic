build-image:
  stage: package
  tags:
    - k8s
  needs:
    - build-app
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script: []
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$HARBOR_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --destination "$HARBOR_IMAGE:latest" \
        $KANIKO_EXTRA_ARGS
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-app:
  stage: deploy
  tags:
    - k8s
  needs:
    - build-image
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [""]
  before_script: []
  environment:
    name: app-dev
  script:
    # KUBE_CONFIG 支持两种形式：变量类型选 File（值是文件路径）或变量类型 Variable（值是 base64）
    - |
      if [ -z "$KUBE_CONFIG" ]; then
        echo "KUBE_CONFIG 变量为空，请在 设置-CI/CD-变量 中添加"; exit 1
      elif [ -f "$KUBE_CONFIG" ]; then
        export KUBECONFIG="$KUBE_CONFIG"
        echo "kubeconfig: 使用 File 类型变量"
      elif printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
        mkdir -p ~/.kube
        printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
        export KUBECONFIG=~/.kube/config
        chmod 600 ~/.kube/config
        echo "kubeconfig: 使用明文 YAML 变量"
      else
        B64=$(printf '%s' "$KUBE_CONFIG" | tr -d '\r\n ')
        if [ $(( ${#B64} % 4 )) -ne 0 ]; then
          echo "KUBE_CONFIG 既不是文件、不是明文 YAML、也不是完整 base64（长度 ${#B64}）"; exit 1
        fi
        mkdir -p ~/.kube
        printf '%s' "$B64" | base64 -d > ~/.kube/config
        export KUBECONFIG=~/.kube/config
        chmod 600 ~/.kube/config
        echo "kubeconfig: 使用 base64 变量解码"
      fi
    - kubectl config get-contexts
    - kubectl version --client
    # 命名空间、数据库、Service 都在清单里
    - kubectl apply -f k8s/app-dev.yml
    # 换成本次构建的镜像
    - kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$HARBOR_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
