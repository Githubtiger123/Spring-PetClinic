stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.artifact.threads=16"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -s $CI_PROJECT_DIR/ci/settings.xml"

default:
  tags:
    - k8s
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
  before_script:
    - java -version
    - mvn -version

compile:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests compile
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 hour

unit-test:
  stage: test
  needs:
    - compile
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
