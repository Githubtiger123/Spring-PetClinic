stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.artifact.threads=16"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dcheckstyle.skip=true -Dspring-javaformat.skip=true -s $CI_PROJECT_DIR/ci/settings.xml"
  # kaniko 构建器镜像；gcr.io 直连超时，走 DaoCloud 镜像代理（也可同步到本机 Harbor 后改成 Harbor 地址）
  KANIKO_IMAGE: "gcr.m.daocloud.io/kaniko-project/executor:v1.23.2-debug"
  # Harbor 是自签证书 https 时保留下面两个跳过校验的参数；证书可信就把它置空
  KANIKO_EXTRA_ARGS: "--skip-tls-verify --skip-tls-verify-pull"
  # 目标 Harbor（可用项目 CI/CD 变量覆盖，UI 变量优先级更高）
  HARBOR_REGISTRY: "10.60.78.61:30003"
  HARBOR_PROJECT: "interrogation-services"
  HARBOR_IMAGE: "$HARBOR_REGISTRY/$HARBOR_PROJECT/spring-petclinic"
  # 部署相关
  KUBECTL_IMAGE: "alpine/k8s:1.30.4"
  K8S_NAMESPACE: "app-dev"
  K8S_DEPLOYMENT: "petclinic"
  K8S_CONTAINER: "workload"

.maven:
  tags:
    - k8s
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
  before_script:
    - java -version
    - mvn -version

build-app:
  extends: .maven
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

# 临时注释：测试步骤先跳过，等整条链路跑通后再打开
